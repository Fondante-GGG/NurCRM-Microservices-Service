events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    upstream auth_backend {
        server auth-service:8001;
    }
    upstream catalog_backend {
        server catalog-service:8002;
    }
    upstream client_backend {
        server client-service:8003;
    }
    upstream schedule_backend {
        server schedule-service:8004;
    }
    upstream booking_backend {
        server booking-service:8005;
    }
    upstream finance_backend {
        server finance-service:8006;
    }
    upstream analytics_backend {
        server analytics-service:8007;
    }
    upstream notification_backend {
        server notification-service:8008;
    }
    upstream public_gateway {
        server public-gateway:8010;
    }
    upstream realtime_gateway {
        server realtime-gateway:8020;
    }
    upstream admin_backend {
        server admin-panel:8000;
    }
    upstream frontend_usluga {
        server 172.17.0.1:3001;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 12M;

        # JWKS
        location /.well-known/jwks.json {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Auth service routes
        location /api/v1/auth/ {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/users/ {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # TZ Support & Spheres routes (front-usluga compatibility)
        location /api/main/appointments/ {
            proxy_pass http://schedule_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/main/shifts/ {
            proxy_pass http://schedule_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/main/ {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/support/ {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /me {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Catalog service routes
        location /api/v1/catalog/ {
            proxy_pass http://catalog_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/barbershop/service-categories/ {
            proxy_pass http://catalog_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/barbershop/services/ {
            proxy_pass http://catalog_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Client service routes
        location /api/v1/clients/ {
            proxy_pass http://client_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/barbershop/clients/ {
            proxy_pass http://client_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Schedule service routes
        location /api/v1/schedule/ {
            proxy_pass http://schedule_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/barbershop/appointments/ {
            proxy_pass http://schedule_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Booking service routes
        location /api/v1/bookings/ {
            proxy_pass http://booking_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/barbershop/bookings/ {
            proxy_pass http://booking_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Finance service routes
        location /api/v1/finance/ {
            proxy_pass http://finance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/barbershop/salary/ {
            proxy_pass http://finance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/construction/shifts/ {
            proxy_pass http://finance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Analytics service routes
        location /api/v1/analytics/ {
            proxy_pass http://analytics_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/barbershop/analytics/ {
            proxy_pass http://analytics_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Notification service routes
        location /api/v1/notifications/ {
            proxy_pass http://notification_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Public widget gateway (High performance Go)
        location /api/barbershop/public/ {
            proxy_pass http://public_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Realtime WebSocket & SSE
        location /ws {
            proxy_pass http://realtime_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
        location /sse {
            proxy_pass http://realtime_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
        }

        # Django Admin Panel (for support & platform owners)
        location /admin/ {
            proxy_pass http://admin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Protected Media Files (served only via X-Accel-Redirect from client-service)
        location /protected-media/ {
            internal;
            alias /var/lib/crm/media/clients/;
        }

        # Frontend Next.js (front-usluga)
        location / {
            proxy_pass http://frontend_usluga;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
